<div class="modal-overlay" *ngIf="isOpen" (click)="onOverlayClick($event)">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title">Create Invoice</h2>
      <button class="close-button" (click)="onClose()">
        <svg width="24" height="24" viewBox="0 0 20 20" fill="currentColor">
          <path
            fill-rule="evenodd"
            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>

    <form class="modal-body" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label class="label">Client Name *</label>
          <input
            type="text"
            class="input"
            placeholder="Enter client name"
            [(ngModel)]="formData.client"
            name="clientName"
            required
          />
        </div>

        <div class="form-group">
          <label class="label">Client Email *</label>
          <input
            type="email"
            class="input"
            placeholder="Enter client email"
            [(ngModel)]="formData.clientEmail"
            name="clientEmail"
            required
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="label">Service *</label>
          <input
            type="text"
            class="input"
            placeholder="Enter service name"
            [(ngModel)]="formData.service"
            name="service"
            required
          />
        </div>

        <div class="form-group">
          <label class="label">Amount ($) *</label>
          <input
            type="number"
            class="input"
            placeholder="0.00"
            [(ngModel)]="formData.amount"
            name="amount"
            step="0.01"
            min="0"
            required
          />
        </div>
      </div>

      <div class="form-group full-width">
        <label class="label">Due Date *</label>
        <input
          type="date"
          class="input"
          [(ngModel)]="formData.dueDate"
          name="dueDate"
          required
        />
      </div>

      <div class="form-group full-width">
        <label class="label">Description</label>
        <textarea
          class="textarea"
          rows="4"
          placeholder="Add invoice details or notes..."
          [(ngModel)]="formData.description"
          name="description"
          maxlength="500"
        ></textarea>
        <div class="character-count">
          {{ formData.description?.length || 0 }}/500 characters
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onClose()">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="isLoading">
          {{ isLoading ? "Creating..." : "Create Invoice" }}
        </button>
      </div>
    </form>
  </div>
</div>
